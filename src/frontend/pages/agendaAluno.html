<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/pages/redirectToApp.js"></script>
<title>Pulse Manager – Agenda Aluno</title>
<!-- Base: layout sidebar + topbar (Aluno) -->
<link rel="stylesheet" href="../css/themes/guiaAluno.css">
<link rel="stylesheet" href="../css/components.css">
<!-- Fontes e ícones -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<!-- Estilos da página -->
<link rel="stylesheet" href="../css/pages/agendaAluno.css">
</head>
<body>

  <!-- ========== MENU LATERAL ========== -->
  <aside class="menuLateral" id="menuLateral">
    <div class="menuLateral__logo">
      <div class="menuLateral__logo-brand">
        <img src="../assets/images/logoIcon.png" alt="Pulse Manager" class="menuLateral__logo-icon" />
        <span class="menuLateral__logo-name">PULSE<br>MANAGER</span>
      </div>
      <span class="menuLateral__logo-role"></span>
    </div>
    <nav class="menuLateral__nav">
      <span class="menuLateral__section-label">Menu Principal</span>
      <ul class="menuLateral__menu"></ul>
    </nav>
    <footer class="menuLateral__footer">
      <a href="#" class="menuLateral__settings menuLateral__link">
        <i class="ti ti-settings menuLateral__icon"></i>
        <span>Configurações</span>
      </a>
      <div class="menuLateral__user">
        <div class="menuLateral__avatar"></div>
        <div class="menuLateral__user-info">
          <span class="menuLateral__user-name"></span>
          <span class="menuLateral__user-role"></span>
        </div>
      </div>
    </footer>
  </aside>

  <!-- ========== ÁREA PRINCIPAL ========== -->
  <div class="paginaMain">

    <!-- MENU SUPERIOR -->
    <header class="menuSuperior" id="menuSuperior">
      <span class="menuSuperior__breadcrumb"></span>
      <div class="menuSuperior__search">
        <i class="ti ti-search menuSuperior__search-icon"></i>
        <input type="text" class="menuSuperior__search-input" placeholder="Buscar" autocomplete="off" />
      </div>
      <div class="menuSuperior__actions">
        <button class="menuSuperior__bell" title="Notificações">
          <i class="ti ti-bell"></i>
        </button>
        <button class="menuSuperior__avatar-btn" title="Perfil"></button>
      </div>
    </header>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="paginaConteudo" style="padding: 28px 36px; gap: 20px; overflow-y: auto;">

      <div class="ag-full">

        <div class="ag-header">
          <div>
            <div class="ag-title"><i class="ti ti-calendar" style="font-size:18px;vertical-align:-2px;margin-right:8px;color:#003870;"></i>Agenda</div>
            <div class="ag-month">Junho de 2026</div>
            <div class="ag-readonly-note"><i class="ti ti-eye"></i> Somente visualização · dados demonstrativos</div>
          </div>
          <div class="ag-legend">
            <div class="ag-legend-item"><div class="ag-legend-dot" style="background:#003870"></div>Evento</div>
            <div class="ag-legend-item"><div class="ag-legend-dot" style="background:#7B4FD9"></div>Consulta</div>
            <div class="ag-legend-item"><div class="ag-legend-dot" style="background:#F4A261"></div>Aula</div>
            <div class="ag-legend-item"><div class="ag-legend-dot" style="background:#33B458"></div>Mentoria</div>
            <div class="ag-legend-item"><div class="ag-legend-dot" style="background:#FFD927;border:1px solid #e0c000;"></div>Formatura</div>
          </div>
        </div>

        <!-- Calendário gerado pelo JS -->
        <div class="ag-cal" id="ag-cal"></div>

        <!-- Detalhe do evento (aparece ao clicar) -->
        <div class="ag-detail" id="ag-detail"></div>

      </div>

    </main>
  </div><!-- fim .paginaMain -->

<!-- config.js deve vir ANTES dos outros scripts -->
<script src="../js/services/configAluno.js"></script>
<script src="../js/components/guiaAluno.js"></script>
<script src="../js/components/menuSuperior.js"></script>
<script src="../js/pages/agendaAluno.js"></script>
</body>
</html>
