<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil da Equipe — Pulse Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="../css/pages/modalConfEquipe.css">
</head>
<body>

<div id="main-content" style="width:100%;min-height:100vh;background:#fff;"></div>

<!-- Overlay + Modal -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">

    <div class="modal-header">
      <div class="mh-top">
        <div class="modal-avatar" id="m-initials">JM</div>
        <div>
          <div class="modal-name" id="m-name">João Mário</div>
          <div class="modal-meta" id="m-cargo-meta">Psicólogo · Pulse Manager</div>
        </div>
      </div>
      <div class="modal-badges">
        <span class="badge badge-cargo"><i class="ti ti-heart" style="font-size:11px;"></i> Psicólogo</span>
        <span class="badge badge-id"><i class="ti ti-id-badge" style="font-size:11px;"></i> EQ-2024-012</span>
      </div>
      <button class="close-btn" onclick="closeModal()" aria-label="Fechar modal"><i class="ti ti-x"></i></button>
    </div>

    <div class="tab-strip">
      <button class="tab-btn active" onclick="showTab('dados',this)"><i class="ti ti-user"></i> Dados</button>
      <button class="tab-btn" onclick="showTab('contato',this)"><i class="ti ti-phone"></i> Contato</button>
    </div>

    <div class="modal-body">

      <!-- Aba: Dados -->
      <div id="tab-dados" class="tab-panel active">
        <div class="sec-label">Identificação</div>
        <div class="field-grid">
          <div class="field">
            <label><i class="ti ti-id-badge"></i> ID membro</label>
            <input type="text" value="EQ-2024-012" readonly>
            <span class="field-hint">Identificador único da equipe</span>
          </div>
          <div class="field">
            <label><i class="ti ti-briefcase"></i> Cargo</label>
            <select id="f-cargo" onchange="updateCargo()">
              <option selected>Psicólogo</option>
              <option>Gestor</option>
              <option>Mentor</option>
              <option>Coordenador</option>
              <option>Administrador</option>
            </select>
          </div>
          <div class="field span2">
            <label><i class="ti ti-user"></i> Nome completo</label>
            <input type="text" id="f-nome" value="João Mário" oninput="updateHeader()">
          </div>
          <div class="field">
            <label><i class="ti ti-id-badge-2"></i> CPF</label>
            <input type="text" value="987.654.321-00" maxlength="14" placeholder="000.000.000-00">
          </div>
        </div>
      </div>

      <!-- Aba: Contato -->
      <div id="tab-contato" class="tab-panel">
        <div class="sec-label">Informações de contato</div>
        <div class="field-grid">
          <div class="field">
            <label><i class="ti ti-mail"></i> E-mail institucional</label>
            <input type="email" value="joao.mario@pulsemais.org.br">
          </div>
          <div class="field">
            <label><i class="ti ti-phone"></i> Telefone</label>
            <input type="tel" value="(11) 91234-5678">
          </div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <div class="footer-left">
        <i class="ti ti-lock"></i>
        Última edição: hoje às 09:15
      </div>
      <div class="footer-right">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveProfile()"><i class="ti ti-device-floppy"></i> Salvar alterações</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast">
  <i class="ti ti-circle-check"></i> Perfil atualizado com sucesso
</div>

<script src="../js/components/modalConfEquipe.js"></script>
</body>
</html>
